plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def releaseIdentityFile = rootProject.file('signing/release.json')
def releaseIdentity = releaseIdentityFile.exists() ? new groovy.json.JsonSlurper().parse(releaseIdentityFile) : null

android {
    namespace 'com.zac688.adofaicoverstudio'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.zac688.adofaicoverstudio'
        minSdk 29
        targetSdk 35
        versionCode 80101
        versionName '0.8.1-android.1'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        if (releaseIdentity) {
            release {
                storeFile rootProject.file('signing/' + releaseIdentity.storeFile)
                storePassword releaseIdentity.storePassword
                keyAlias releaseIdentity.keyAlias
                keyPassword releaseIdentity.keyPassword
            }
        }
    }
    buildTypes {
        debug { debuggable true; applicationIdSuffix '.debug' }
        release {
            minifyEnabled false
            if (releaseIdentity) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress 'zip', 'onnx' }
    sourceSets { androidTest.assets.srcDir 'build/generated/androidTestAssets' }
}

chaquopy {
    defaultConfig {
        version '3.10'
        buildPython System.getenv('ADOFAI_BUILD_PYTHON') ?: 'python'
        pip {
            def proxy = System.getenv('HTTPS_PROXY')
            if (proxy) { options '--proxy', proxy }
            install 'pydantic==1.10.26'
            install 'numpy==1.23.3'
            install 'Pillow==9.2.0'
            install 'opencv-python-headless==4.5.1.48'
            install 'fonttools==4.65.0'
            install 'Brotli==1.0.7'
        }
    }
    sourceSets {
        main { srcDir 'build/generated/python' }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
